spring.application.name=bms
spring.config.import=optional:file:./application-secrets.properties

spring.datasource.url=${TAARA_DB_URL}
spring.datasource.username=${TAARA_DB_USERNAME}
spring.datasource.password=${TAARA_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Calcutta
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.schemas=public
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.default-property-inclusion=non_null

app.cors.allowed-origins=${TAARA_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
app.auth.supabase.url=${TAARA_SUPABASE_URL:}
app.auth.supabase.anon-key=${TAARA_SUPABASE_ANON_KEY:}
app.auth.supabase.service-role-key=${TAARA_SUPABASE_SERVICE_ROLE_KEY:}
app.auth.jwt.issuer=${TAARA_SUPABASE_JWT_ISSUER:}
app.auth.jwt.jwk-set-uri=${TAARA_SUPABASE_JWT_JWKS_URL:}
app.auth.bootstrap-admin.email=${TAARA_BOOTSTRAP_ADMIN_EMAIL:}
app.auth.bootstrap-admin.password=${TAARA_BOOTSTRAP_ADMIN_PASSWORD:}
